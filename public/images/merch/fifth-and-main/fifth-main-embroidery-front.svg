<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 520" role="img" aria-labelledby="title desc">
  <title id="title">Fifth &amp; Main embroidery artwork</title>
  <desc id="desc">Two-colour embroidery-safe wordmark based on the Here We Are album branding.</desc>
  <rect width="2400" height="520" fill="none"/>
  <g fill="#F3F0E8" font-family="Arial, Helvetica, sans-serif" font-weight="300" font-size="230" letter-spacing="52">
    <text x="90" y="350">FIFTH</text>
    <text x="1480" y="350">MAIN</text>
  </g>
  <text x="1200" y="405" text-anchor="middle" fill="#B78B5A" font-family="Georgia, 'Times New Roman', serif" font-size="470" font-style="italic">&amp;</text>
</svg>
