name: Publish PNR009 binary assets

on:
  push:
    paths:
      - ".github/workflows/pnr009-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Attach Luca Moretti audio, artwork and catalogue
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}
          PARENT: ${{ github.sha }}
          TREE_ENTRIES_B64: ""
        run: |
          set -euo pipefail
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          base_tree=$(curl -fsSL "${headers[@]}" "$API/git/commits/$PARENT" | jq -er '.tree.sha')
          tree_entries=$(printf '%s' "$TREE_ENTRIES_B64" | base64 --decode)
          tree_payload=$(jq -n --arg base "$base_tree" --argjson tree "$tree_entries" '{base_tree:$base,tree:$tree}')
          new_tree=$(curl -fsSL -X POST "${headers[@]}" "$API/git/trees" -d "$tree_payload" | jq -er '.sha')
          commit_payload=$(jq -n --arg message "Publish Luca Moretti as PNR009" --arg tree "$new_tree" --arg parent "$PARENT" '{message:$message,tree:$tree,parents:[$parent]}')
          new_commit=$(curl -fsSL -X POST "${headers[@]}" "$API/git/commits" -d "$commit_payload" | jq -er '.sha')
          ref_payload=$(jq -n --arg sha "$new_commit" '{sha:$sha,force:false}')
          curl -fsSL -X PATCH "${headers[@]}" "$API/git/refs/heads/main" -d "$ref_payload" | jq -er '.object.sha'
